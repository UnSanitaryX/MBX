<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">A controlled failure, from start to recovery</title>
<desc id="desc">An illustration of the supplied demo timeline, not an application screenshot. Temperature ramps from 22.5 to 35, delay is injected, replies time out, then the original state is restored.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c27"/><stop offset="1" stop-color="#080d14"/></linearGradient>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#20ddec" stop-opacity=".18"/><stop offset="1" stop-color="#20ddec" stop-opacity="0"/></linearGradient>
<linearGradient id="stroke"><stop stop-color="#58f1ef"/><stop offset="1" stop-color="#1596c3"/></linearGradient>
<pattern id="grid" width="56" height="44" patternUnits="userSpaceOnUse"><path d="M56 0H0V44" fill="none" stroke="#7da3b9" stroke-opacity=".055"/></pattern>
</defs>
<rect x="1" y="1" width="1198" height="498" rx="20" fill="url(#bg)" stroke="#243849"/>
<rect x="2" y="2" width="1196" height="496" rx="20" fill="url(#grid)"/>
<g font-family="Segoe UI,Arial,sans-serif">
<text x="40" y="45" fill="#20ddec" font-size="12" letter-spacing="3">TIMELINE / BUILT-IN DEMO</text>
<text x="40" y="88" fill="#f0f6fb" font-size="29" font-weight="700">A controlled failure. A visible recovery.</text>
<text x="1158" y="46" text-anchor="end" fill="#9bb2c4" font-size="12" letter-spacing="2">15 SECONDS / 5 STEPS</text>
<path d="M40 113H1160" stroke="#263b4b"/>
<g fill="#a0b6c8" font-size="12"><text x="40" y="154">TEMPERATURE</text><text x="40" y="174" fill="#617f96">22.5 → 35</text><text x="40" y="276">RESPONSE DELAY</text><text x="40" y="296" fill="#617f96">150 ms</text><text x="40" y="348">DEVICE REPLIES</text><text x="40" y="368" fill="#617f96">Timeout injection</text></g>
<g stroke="#23394a" stroke-dasharray="3 7"><path d="M240 137V391"/><path d="M360 137V391"/><path d="M480 137V391"/><path d="M660 137V391"/><path d="M780 137V391"/><path d="M900 137V391"/><path d="M960 137V391"/><path d="M1140 137V391"/></g>
<path d="M240 216H360L660 151H1140V235H240Z" fill="url(#area)"/>
<path d="M240 216H360L660 151H1140" fill="none" stroke="url(#stroke)" stroke-width="3" stroke-linejoin="round"/>
<circle cx="240" cy="216" r="5" fill="#20ddec"/><circle cx="360" cy="216" r="5" fill="#20ddec"/><circle cx="660" cy="151" r="5" fill="#20ddec"/>
<text x="492" y="169" fill="#a2f8ff" font-size="12" transform="rotate(-12 492 169)">RAMP TO 35</text>
<rect x="240" y="263" width="900" height="28" rx="7" fill="#122431"/>
<rect x="480" y="263" width="180" height="28" rx="7" fill="#173a40" stroke="#20ddec" stroke-opacity=".65"/>
<text x="570" y="282" text-anchor="middle" fill="#a8f4f2" font-size="11" letter-spacing="1">DELAY ACTIVE</text>
<rect x="240" y="335" width="900" height="28" rx="7" fill="#122431"/>
<rect x="780" y="335" width="120" height="28" rx="7" fill="#422e23" stroke="#f2ad73" stroke-opacity=".75"/>
<text x="840" y="354" text-anchor="middle" fill="#ffd2a7" font-size="11" letter-spacing="1">NO REPLY</text>
<path d="M960 326V374" stroke="#20ddec" stroke-width="2"/><circle cx="960" cy="326" r="4" fill="#20ddec"/><text x="974" y="319" fill="#88c7d3" font-size="11">CLEAR FAULTS</text>
<path d="M1140 136V391" stroke="#7ad9d2" stroke-opacity=".6"/>
<g fill="#69869d" font-family="Consolas,monospace" font-size="12" text-anchor="middle"><text x="240" y="411">0s</text><text x="360" y="411">2s</text><text x="480" y="411">4s</text><text x="660" y="411">7s</text><text x="780" y="411">9s</text><text x="900" y="411">11s</text><text x="960" y="411">12s</text><text x="1140" y="411">15s</text></g>
<path d="M40 435H1160" stroke="#263b4b"/>
<circle cx="48" cy="464" r="4" fill="#20ddec"/><text x="64" y="469" fill="#a3bccd" font-size="12">Independent actions. One repeatable timeline.</text>
<text x="1158" y="469" text-anchor="end" fill="#73d4cf" font-size="12">FINISH → RESTORE STARTING STATE</text>
</g>
</svg>
